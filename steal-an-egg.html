<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopKarot - Steal an Egg</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

header{
    background:linear-gradient(135deg,#111827,#1f2937);
    color:white;
    box-shadow:0 3px 15px rgba(0,0,0,.15);
}

.header-inner{
    max-width:1200px;
    margin:auto;
    min-height:68px;
    padding:12px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:22px;
    font-weight:900;
}

.logo span{
    color:#facc15;
}

.back-btn{
    border:0;
    background:#374151;
    color:white;
    padding:10px 16px;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:25px 16px 50px;
}

.hero{
    position:relative;
    overflow:hidden;
    background:linear-gradient(135deg,#facc15,#f59e0b);
    border-radius:20px;
    padding:30px 25px;
    margin-bottom:22px;
    box-shadow:0 8px 25px rgba(0,0,0,.1);
}

.hero h1{
    margin:0 0 8px;
    font-size:32px;
}

.hero p{
    margin:0;
    line-height:1.6;
}

.hero-egg{
    position:absolute;
    right:35px;
    top:50%;
    transform:translateY(-50%);
    font-size:90px;
    opacity:.18;
}

.tabs{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:22px;
}

.tab{
    border:0;
    background:white;
    color:#111827;
    padding:13px 20px;
    border-radius:12px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 2px 9px rgba(0,0,0,.08);
}

.tab.active{
    background:#111827;
    color:white;
}

.section{
    display:none;
}

.section.active{
    display:block;
}

.section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:18px;
}

.section-head h2{
    margin:0;
}

.search{
    width:320px;
    max-width:100%;
    padding:12px 14px;
    border:1px solid #d1d5db;
    border-radius:10px;
    outline:none;
    background:white;
}

.filters{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.filter{
    border:1px solid #d1d5db;
    background:white;
    padding:10px 16px;
    border-radius:10px;
    font-weight:800;
    cursor:pointer;
}

.filter.active{
    background:#111827;
    color:white;
    border-color:#111827;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.card{
    background:white;
    border-radius:16px;
    padding:18px;
    border:1px solid #e5e7eb;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);
    box-shadow:0 9px 25px rgba(0,0,0,.12);
}

.card-title{
    font-size:18px;
    font-weight:800;
    margin-bottom:10px;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:8px;
    font-size:12px;
    font-weight:800;
    background:#dcfce7;
    color:#166534;
    margin-bottom:12px;
}

.badge.free{
    background:#dbeafe;
    color:#1d4ed8;
}

.price{
    margin:12px 0;
    font-size:23px;
    font-weight:900;
    color:#dc2626;
}

.price.free{
    color:#16a34a;
}

.info{
    color:#6b7280;
    font-size:14px;
    line-height:1.7;
}

.buy-btn{
    width:100%;
    border:0;
    background:#111827;
    color:white;
    padding:12px;
    border-radius:10px;
    margin-top:15px;
    font-weight:800;
    cursor:pointer;
}

.buy-btn:hover{
    background:#374151;
}

.service-icon{
    font-size:38px;
    margin-bottom:8px;
}

.service-description{
    color:#4b5563;
    line-height:1.65;
    min-height:70px;
}

.empty{
    grid-column:1/-1;
    background:white;
    padding:40px 20px;
    border-radius:16px;
    text-align:center;
    color:#6b7280;
}

footer{
    text-align:center;
    color:#6b7280;
    padding:25px 15px;
}

@media(max-width:1000px){
    .grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:750px){
    .grid{
        grid-template-columns:repeat(2,1fr);
    }

    .section-head{
        flex-direction:column;
        align-items:stretch;
    }

    .search{
        width:100%;
    }
}

@media(max-width:480px){
    .grid{
        grid-template-columns:1fr;
    }

    .header-inner{
        flex-direction:column;
    }

    .hero h1{
        font-size:27px;
    }

    .hero-egg{
        font-size:60px;
        right:15px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">

        <div class="logo">
            SHOP<span>KAROT</span> - STEAL AN EGG
        </div>

        <button class="back-btn" onclick="location.href='index.html'">
            ← Về Shop
        </button>

    </div>
</header>

<main class="container">

    <div class="hero">
        <div class="hero-egg">🥚</div>

        <h1>🥚 Steal an Egg</h1>

        <p>
            Acc Steal an Egg và dịch vụ Steal an Egg tại SHOPKAROT.
        </p>
    </div>


    <div class="tabs">

        <button
            class="tab active"
            onclick="showTab('accounts',this)">
            👤 Acc Steal an Egg
        </button>

        <button
            class="tab"
            onclick="showTab('services',this)">
            🛠️ Dịch vụ Steal an Egg
        </button>

    </div>


    <!-- ACC -->
    <section id="accounts" class="section active">

        <div class="section-head">

            <h2>👤 Acc Steal an Egg</h2>

            <input
                id="accountSearch"
                class="search"
                type="text"
                placeholder="🔎 Tìm acc..."
                oninput="filterAccounts()">

        </div>


        <div class="filters">

            <button
                class="filter active"
                onclick="selectPrice('ALL',this)">
                Tất cả
            </button>

            <button
                class="filter"
                onclick="selectPrice('0K',this)">
                🟢 0K
            </button>

            <button
                class="filter"
                onclick="selectPrice('20K',this)">
                🔵 20K
            </button>

            <button
                class="filter"
                onclick="selectPrice('50K',this)">
                🟠 50K
            </button>

        </div>


        <div id="accountGrid" class="grid"></div>

    </section>


    <!-- DỊCH VỤ -->
    <section id="services" class="section">

        <div class="section-head">

            <h2>🛠️ Dịch vụ Steal an Egg</h2>

            <input
                id="serviceSearch"
                class="search"
                type="text"
                placeholder="🔎 Tìm dịch vụ..."
                oninput="filterServices()">

        </div>

        <div id="serviceGrid" class="grid"></div>

    </section>

</main>


<footer>
    SHOPKAROT © 2026 - Steal an Egg
</footer>


<script>

const accounts = [

    {
        id:"SAE-0K-001",
        name:"Acc Steal an Egg #001",
        package:"0K",
        price:0,
        status:"Còn hàng",
        description:"Acc Steal an Egg gói 0K.",
        page:"steal-an-egg-0k-001.html"
    },

    {
        id:"SAE-20K-001",
        name:"Acc Steal an Egg #001",
        package:"20K",
        price:20000,
        status:"Còn hàng",
        description:"Acc Steal an Egg gói 20K.",
        page:"steal-an-egg-20k-001.html"
    },

    {
        id:"SAE-50K-001",
        name:"Acc Steal an Egg #001",
        package:"50K",
        price:50000,
        status:"Còn hàng",
        description:"Acc Steal an Egg gói 50K.",
        page:"steal-an-egg-50k-001.html"
    }

];


const services = [

    {
        id:"DV-SAE-001",
        name:"Cày Steal an Egg",
        price:50000,
        status:"Đang nhận",
        description:"Dịch vụ cày Steal an Egg theo yêu cầu của khách."
    },

    {
        id:"DV-SAE-002",
        name:"Farm Egg",
        price:100000,
        status:"Đang nhận",
        description:"Farm Egg theo mục tiêu hoặc thời gian khách yêu cầu."
    },

    {
        id:"DV-SAE-003",
        name:"Farm VIP",
        price:200000,
        status:"Đang nhận",
        description:"Dịch vụ farm nâng cao dành cho khách hàng."
    }

];


let currentPrice = "ALL";


function money(number){

    return Number(number).toLocaleString("vi-VN") + "đ";

}


function renderAccounts(data){

    const grid = document.getElementById("accountGrid");

    if(data.length === 0){

        grid.innerHTML =
        `<div class="empty">
            Không có acc trong mục này.
        </div>`;

        return;
    }


    grid.innerHTML = data.map(acc => {

        const free = acc.price === 0;

        return `

        <div class="card">

            <span class="badge ${free ? "free" : ""}">
                ${acc.status}
            </span>

            <div class="card-title">
                ${acc.name}
            </div>

            <div class="info">

                Mã: <b>${acc.id}</b><br>

                Gói: <b>${acc.package}</b>

            </div>

            <div class="price ${free ? "free" : ""}">
                ${money(acc.price)}
            </div>

            <div class="info">
                ${acc.description}
            </div>

            <button
                class="buy-btn"
                onclick="location.href='${acc.page}'">

                🛒 Xem / Mua acc

            </button>

        </div>

        `;

    }).join("");

}


function renderServices(data){

    const grid = document.getElementById("serviceGrid");

    if(data.length === 0){

        grid.innerHTML =
        `<div class="empty">
            Không tìm thấy dịch vụ.
        </div>`;

        return;
    }


    grid.innerHTML = data.map(service => {

        return `

        <div class="card">

            <div class="service-icon">
                🛠️
            </div>

            <span class="badge">
                ${service.status}
            </span>

            <div class="card-title">
                ${service.name}
            </div>

            <div class="service-description">
                ${service.description}
            </div>

            <div class="price">
                ${money(service.price)}
            </div>

            <div class="info">
                Mã dịch vụ: ${service.id}
            </div>

            <button
                class="buy-btn"
                onclick="alert('Vui lòng liên hệ Admin để đặt dịch vụ.')">

                🛒 Đặt dịch vụ

            </button>

        </div>

        `;

    }).join("");

}


function showTab(name,button){

    document
        .querySelectorAll(".section")
        .forEach(section =>
            section.classList.remove("active")
        );

    document
        .querySelectorAll(".tab")
        .forEach(tab =>
            tab.classList.remove("active")
        );

    document
        .getElementById(name)
        .classList.add("active");

    button.classList.add("active");

}


function selectPrice(price,button){

    currentPrice = price;

    document
        .querySelectorAll(".filter")
        .forEach(item =>
            item.classList.remove("active")
        );

    button.classList.add("active");

    filterAccounts();

}


function filterAccounts(){

    const keyword =
        document
            .getElementById("accountSearch")
            .value
            .toLowerCase()
            .trim();


    const result = accounts.filter(acc => {

        const text =
            (
                acc.id +
                " " +
                acc.name +
                " " +
                acc.package
            ).toLowerCase();


        const searchOK =
            text.includes(keyword);


        const priceOK =
            currentPrice === "ALL" ||
            acc.package === currentPrice;


        return searchOK && priceOK;

    });


    renderAccounts(result);

}


function filterServices(){

    const keyword =
        document
            .getElementById("serviceSearch")
            .value
            .toLowerCase()
            .trim();


    const result = services.filter(service => {

        const text =
            service.id +
            " " +
            service.name +
            " " +
            service.description;

        return text
            .toLowerCase()
            .includes(keyword);

    });


    renderServices(result);

}


renderAccounts(accounts);
renderServices(services);

</script>

</body>
</html>
