<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SHOPKAROT - Steal an Egg</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

header{
    background:linear-gradient(135deg,#111827,#1f2937);
    color:#fff;
    padding:16px 20px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:23px;
    font-weight:800;
}

.logo span{
    color:#facc15;
}

.back-btn{
    border:0;
    background:#374151;
    color:white;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
    font-weight:700;
}

.back-btn:hover{
    background:#4b5563;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:25px 16px 50px;
}

.hero{
    background:linear-gradient(135deg,#facc15,#f59e0b);
    border-radius:18px;
    padding:30px 25px;
    margin-bottom:25px;
    box-shadow:0 8px 25px rgba(0,0,0,.1);
}

.hero h1{
    margin:0 0 8px;
    font-size:32px;
}

.hero p{
    margin:0;
    font-size:16px;
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:25px;
    flex-wrap:wrap;
}

.tab{
    border:0;
    padding:13px 20px;
    border-radius:12px;
    background:white;
    cursor:pointer;
    font-weight:700;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.tab.active{
    background:#111827;
    color:#fff;
}

.section{
    display:none;
}

.section.active{
    display:block;
}

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:18px;
}

.section-title h2{
    margin:0;
}

.search{
    width:100%;
    max-width:320px;
    padding:12px 14px;
    border:1px solid #d1d5db;
    border-radius:10px;
    outline:none;
    background:#fff;
}

.price-tabs{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.price-tab{
    border:1px solid #d1d5db;
    background:#fff;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
    font-weight:700;
}

.price-tab.active{
    background:#111827;
    color:#fff;
    border-color:#111827;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.card{
    background:#fff;
    border-radius:16px;
    padding:18px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 22px rgba(0,0,0,.12);
}

.card h3{
    margin:0 0 10px;
    font-size:19px;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:8px;
    background:#dcfce7;
    color:#166534;
    font-size:12px;
    font-weight:700;
    margin-bottom:12px;
}

.badge.free{
    background:#dbeafe;
    color:#1d4ed8;
}

.badge.sold{
    background:#fee2e2;
    color:#991b1b;
}

.price{
    font-size:22px;
    font-weight:800;
    color:#dc2626;
    margin:12px 0;
}

.price.free{
    color:#16a34a;
}

.info{
    font-size:14px;
    color:#6b7280;
    line-height:1.7;
}

.buy-btn{
    width:100%;
    margin-top:15px;
    border:0;
    padding:12px;
    border-radius:10px;
    background:#111827;
    color:#fff;
    font-weight:700;
    cursor:pointer;
}

.buy-btn:hover{
    background:#374151;
}

.buy-btn:disabled{
    background:#9ca3af;
    cursor:not-allowed;
}

.service-card{
    background:#fff;
    border-radius:16px;
    padding:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.service-card h3{
    margin:0 0 12px;
}

.service-description{
    color:#4b5563;
    line-height:1.7;
    min-height:70px;
}

.empty{
    background:#fff;
    border-radius:15px;
    padding:35px;
    text-align:center;
    color:#6b7280;
    grid-column:1/-1;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:999;
    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:#fff;
    width:100%;
    max-width:480px;
    border-radius:18px;
    padding:24px;
    position:relative;
}

.close{
    position:absolute;
    right:15px;
    top:12px;
    border:0;
    background:none;
    font-size:25px;
    cursor:pointer;
}

.modal-box h2{
    margin-top:0;
}

.selected-product{
    background:#f3f4f6;
    border-radius:10px;
    padding:12px;
    margin-bottom:18px;
    line-height:1.6;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    font-weight:700;
}

.form-group input,
.form-group textarea{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:9px;
    outline:none;
}

.form-group textarea{
    min-height:90px;
    resize:vertical;
}

.confirm-btn{
    width:100%;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#16a34a;
    color:#fff;
    font-weight:800;
    cursor:pointer;
}

.notice{
    margin-top:15px;
    padding:12px;
    background:#fff7ed;
    border:1px solid #fed7aa;
    border-radius:10px;
    font-size:13px;
    color:#9a3412;
    line-height:1.6;
}

footer{
    text-align:center;
    padding:25px;
    color:#6b7280;
}

@media(max-width:1000px){
    .grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:700px){
    .grid{
        grid-template-columns:repeat(2,1fr);
    }

    .header-inner{
        flex-direction:column;
    }

    .section-title{
        flex-direction:column;
        align-items:stretch;
    }

    .search{
        max-width:none;
    }
}

@media(max-width:480px){
    .grid{
        grid-template-columns:1fr;
    }

    .hero h1{
        font-size:25px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">

        <div class="logo">
            SHOP<span>KAROT</span> - STEAL AN EGG
        </div>

        <button class="back-btn" onclick="goBack()">
            ← Về Shop
        </button>

    </div>
</header>


<div class="container">

    <div class="hero">

        <h1>🥚 Steal an Egg</h1>

        <p>
            Acc Steal an Egg và dịch vụ Steal an Egg tại SHOPKAROT.
        </p>

    </div>


    <!-- ================= TAB ================= -->

    <div class="tabs">

        <button
            class="tab active"
            onclick="showTab('accounts',this)"
        >
            👤 Acc Steal an Egg
        </button>

        <button
            class="tab"
            onclick="showTab('services',this)"
        >
            🛠️ Dịch vụ Steal an Egg
        </button>

    </div>


    <!-- =====================================================
         ACC STEAL AN EGG
         ===================================================== -->

    <section id="accounts" class="section active">

        <div class="section-title">

            <h2>👤 Acc Steal an Egg</h2>

            <input
                id="accountSearch"
                class="search"
                type="text"
                placeholder="🔎 Tìm acc..."
                oninput="filterAccounts()"
            >

        </div>


        <!-- GIÁ -->

        <div class="price-tabs">

            <button
                class="price-tab active"
                onclick="selectPrice('ALL',this)"
            >
                Tất cả
            </button>

            <button
                class="price-tab"
                onclick="selectPrice('0K',this)"
            >
                🟢 0K
            </button>

            <button
                class="price-tab"
                onclick="selectPrice('20K',this)"
            >
                🔵 20K
            </button>

            <button
                class="price-tab"
                onclick="selectPrice('50K',this)"
            >
                🟠 50K
            </button>

        </div>


        <div id="accountGrid" class="grid"></div>

    </section>


    <!-- =====================================================
         DỊCH VỤ
         ===================================================== -->

    <section id="services" class="section">

        <div class="section-title">

            <h2>🛠️ Dịch vụ Steal an Egg</h2>

            <input
                id="serviceSearch"
                class="search"
                type="text"
                placeholder="🔎 Tìm dịch vụ..."
                oninput="filterServices()"
            >

        </div>


        <div id="serviceGrid" class="grid"></div>

    </section>

</div>


<footer>
    SHOPKAROT © 2026 - Steal an Egg
</footer>


<!-- =====================================================
     MODAL ĐẶT HÀNG
     ===================================================== -->

<div id="orderModal" class="modal">

    <div class="modal-box">

        <button
            class="close"
            onclick="closeModal()"
        >
            ×
        </button>


        <h2 id="modalTitle">
            Đặt hàng
        </h2>


        <div
            id="selectedProduct"
            class="selected-product"
        ></div>


        <div class="form-group">

            <label>
                Tên khách
            </label>

            <input
                id="customerName"
                type="text"
                placeholder="Nhập tên khách"
            >

        </div>


        <div class="form-group">

            <label>
                Username Roblox
            </label>

            <input
                id="robloxUsername"
                type="text"
                placeholder="Nhập username Roblox"
            >

        </div>


        <div class="form-group">

            <label>
                Ghi chú
            </label>

            <textarea
                id="customerNote"
                placeholder="Nhập ghi chú..."
            ></textarea>

        </div>


        <button
            class="confirm-btn"
            onclick="submitOrder()"
        >
            ✅ Xác nhận đặt hàng
        </button>


        <div class="notice">
            Sau khi đặt đơn, hãy giữ lại mã đơn để Admin kiểm tra và xử lý.
        </div>

    </div>

</div>


<script>

/* =====================================================
   CẤU HÌNH
   ===================================================== */

const SHOP_BACK_URL = "index.html";


/* =====================================================
   ACC STEAL AN EGG

   CHỈ CÓ:
   0K
   20K
   50K
   ===================================================== */

const accounts = [

    {
        id:"SAE-0K-001",
        name:"Acc Steal an Egg #001",
        package:"0K",
        price:0,
        status:"Còn hàng",
        description:"Tài khoản Steal an Egg gói 0K."
    },

    {
        id:"SAE-0K-002",
        name:"Acc Steal an Egg #002",
        package:"0K",
        price:0,
        status:"Còn hàng",
        description:"Tài khoản Steal an Egg gói 0K."
    },

    {
        id:"SAE-20K-001",
        name:"Acc Steal an Egg #001",
        package:"20K",
        price:20000,
        status:"Còn hàng",
        description:"Tài khoản Steal an Egg gói 20K."
    },

    {
        id:"SAE-20K-002",
        name:"Acc Steal an Egg #002",
        package:"20K",
        price:20000,
        status:"Còn hàng",
        description:"Tài khoản Steal an Egg gói 20K."
    },

    {
        id:"SAE-50K-001",
        name:"Acc Steal an Egg #001",
        package:"50K",
        price:50000,
        status:"Còn hàng",
        description:"Tài khoản Steal an Egg gói 50K."
    },

    {
        id:"SAE-50K-002",
        name:"Acc Steal an Egg #002",
        package:"50K",
        price:50000,
        status:"Còn hàng",
        description:"Tài khoản Steal an Egg gói 50K."
    }

];


/* =====================================================
   DỊCH VỤ STEAL AN EGG
   ===================================================== */

const services = [

    {
        id:"DV-SAE-001",
        name:"Cày Steal an Egg",
        price:50000,
        status:"Đang nhận",
        description:
            "Dịch vụ cày Steal an Egg theo yêu cầu của khách."
    },

    {
        id:"DV-SAE-002",
        name:"Farm Egg",
        price:100000,
        status:"Đang nhận",
        description:
            "Farm Egg theo mục tiêu hoặc thời gian khách yêu cầu."
    },

    {
        id:"DV-SAE-003",
        name:"Farm VIP",
        price:200000,
        status:"Đang nhận",
        description:
            "Dịch vụ farm nâng cao dành cho khách hàng."
    }

];


/* =====================================================
   BIẾN
   ===================================================== */

let currentPrice = "ALL";

let currentOrder = null;


/* =====================================================
   FORMAT TIỀN
   ===================================================== */

function formatMoney(number){

    if(Number(number) === 0){

        return "0đ";

    }

    return Number(number).toLocaleString("vi-VN") + "đ";

}


/* =====================================================
   HIỂN THỊ ACC
   ===================================================== */

function renderAccounts(data = accounts){

    const grid =
        document.getElementById("accountGrid");


    if(!data.length){

        grid.innerHTML = `
            <div class="empty">
                Không có acc trong mục này.
            </div>
        `;

        return;

    }


    grid.innerHTML = data.map(acc => {

        const isFree =
            Number(acc.price) === 0;

        const isSold =
            acc.status !== "Còn hàng";


        return `

        <div class="card">

            <span class="badge ${isFree ? "free" : ""} ${isSold ? "sold" : ""}">
                ${escapeHTML(acc.status)}
            </span>

            <h3>
                ${escapeHTML(acc.name)}
            </h3>

            <div class="info">

                Mã acc:
                ${escapeHTML(acc.id)}

                <br>

                Gói:
                <b>${escapeHTML(acc.package)}</b>

            </div>

            <div class="price ${isFree ? "free" : ""}">

                ${formatMoney(acc.price)}

            </div>

            <div class="info">

                ${escapeHTML(acc.description)}

            </div>

            <button
                class="buy-btn"
                ${isSold ? "disabled" : ""}
                onclick="openOrder(
                    'ACC',
                    '${escapeJS(acc.id)}',
                    '${escapeJS(acc.name)}',
                    '${escapeJS(acc.package)}',
                    ${acc.price}
                )"
            >

                ${isSold ? "❌ Hết hàng" : "🛒 Mua acc"}

            </button>

        </div>

        `;

    }).join("");

}


/* =====================================================
   HIỂN THỊ DỊCH VỤ
   ===================================================== */

function renderServices(data = services){

    const grid =
        document.getElementById("serviceGrid");


    if(!data.length){

        grid.innerHTML = `
            <div class="empty">
                Không tìm thấy dịch vụ.
            </div>
        `;

        return;

    }


    grid.innerHTML = data.map(service => `

        <div class="service-card">

            <span class="badge">
                ${escapeHTML(service.status)}
            </span>

            <h3>
                ${escapeHTML(service.name)}
            </h3>

            <div class="service-description">
                ${escapeHTML(service.description)}
            </div>

            <div class="price">
                ${formatMoney(service.price)}
            </div>

            <div class="info">
                Mã dịch vụ:
                ${escapeHTML(service.id)}
            </div>

            <button
                class="buy-btn"
                onclick="openOrder(
                    'SERVICE',
                    '${escapeJS(service.id)}',
                    '${escapeJS(service.name)}',
                    '',
                    ${service.price}
                )"
            >
                🛒 Đặt dịch vụ
            </button>

        </div>

    `).join("");

}


/* =====================================================
   TAB
   ===================================================== */

function showTab(tabName,button){

    document
        .querySelectorAll(".section")
        .forEach(section => {

            section.classList.remove("active");

        });


    document
        .querySelectorAll(".tab")
        .forEach(tab => {

            tab.classList.remove("active");

        });


    document
        .getElementById(tabName)
        .classList.add("active");


    button.classList.add("active");

}


/* =====================================================
   CHỌN GIÁ ACC
   ===================================================== */

function selectPrice(price,button){

    currentPrice = price;


    document
        .querySelectorAll(".price-tab")
        .forEach(tab => {

            tab.classList.remove("active");

        });


    button.classList.add("active");


    filterAccounts();

}


/* =====================================================
   TÌM ACC
   ===================================================== */

function filterAccounts(){

    const keyword =
        document
            .getElementById("accountSearch")
            .value
            .toLowerCase()
            .trim();


    let result = accounts.filter(acc => {

        const matchKeyword =

            acc.id
                .toLowerCase()
                .includes(keyword)

            ||

            acc.name
                .toLowerCase()
                .includes(keyword)

            ||

            acc.package
                .toLowerCase()
                .includes(keyword);


        const matchPrice =

            currentPrice === "ALL"

            ||

            acc.package === currentPrice;


        return matchKeyword && matchPrice;

    });


    renderAccounts(result);

}


/* =====================================================
   TÌM DỊCH VỤ
   ===================================================== */

function filterServices(){

    const keyword =
        document
            .getElementById("serviceSearch")
            .value
            .toLowerCase()
            .trim();


    const result =
        services.filter(service =>

            service.id
                .toLowerCase()
                .includes(keyword)

            ||

            service.name
                .toLowerCase()
                .includes(keyword)

            ||

            service.description
                .toLowerCase()
                .includes(keyword)

        );


    renderServices(result);

}


/* =====================================================
   MỞ FORM ĐẶT HÀNG
   ===================================================== */

function openOrder(
    type,
    id,
    name,
    packageName,
    price
){

    currentOrder = {

        type:type,

        id:id,

        name:name,

        package:packageName,

        price:Number(price)

    };


    document
        .getElementById("modalTitle")
        .textContent =
            type === "ACC"
            ? "🛒 Mua Acc Steal an Egg"
            : "🛠️ Đặt dịch vụ";


    document
        .getElementById("selectedProduct")
        .innerHTML = `

            <b>${escapeHTML(name)}</b>

            <br>

            ${packageName
                ? "Gói: " + escapeHTML(packageName) + "<br>"
                : ""
            }

            Giá:
            <b>${formatMoney(price)}</b>

        `;


    document
        .getElementById("customerName")
        .value = "";


    document
        .getElementById("robloxUsername")
        .value = "";


    document
        .getElementById("customerNote")
        .value = "";


    document
        .getElementById("orderModal")
        .classList.add("show");

}


/* =====================================================
   ĐÓNG FORM
   ===================================================== */

function closeModal(){

    document
        .getElementById("orderModal")
        .classList.remove("show");

    currentOrder = null;

}


/* =====================================================
   ĐẶT HÀNG
   ===================================================== */

function submitOrder(){

    if(!currentOrder){

        alert("Chưa chọn sản phẩm.");

        return;

    }


    const customerName =
        document
            .getElementById("customerName")
            .value
            .trim();


    const robloxUsername =
        document
            .getElementById("robloxUsername")
            .value
            .trim();


    const note =
        document
            .getElementById("customerNote")
            .value
            .trim();


    if(!customerName){

        alert("Vui lòng nhập tên khách.");

        return;

    }


    if(!robloxUsername){

        alert("Vui lòng nhập Username Roblox.");

        return;

    }


    const orderCode =
        "SAE-" +
        Date.now().toString().slice(-8);


    const order = {

        maDon:orderCode,

        loaiDon:currentOrder.type,

        maSanPham:currentOrder.id,

        sanPham:currentOrder.name,

        goi:currentOrder.package,

        gia:currentOrder.price,

        tenKhach:customerName,

        usernameRoblox:robloxUsername,

        ghiChu:note,

        trangThai:"Chờ xử lý",

        ngayTao:new Date().toLocaleString("vi-VN")

    };


    /*
       Lưu tạm ở trình duyệt.

       Sau này có thể thay bằng API
       Google Apps Script của ShopKarot.
    */

    const orders =
        JSON.parse(
            localStorage.getItem(
                "shopkarot_steal_an_egg_orders"
            ) || "[]"
        );


    orders.push(order);


    localStorage.setItem(
        "shopkarot_steal_an_egg_orders",
        JSON.stringify(orders)
    );


    alert(

        "✅ Đặt hàng thành công!\n\n" +

        "Mã đơn: " +
        orderCode +

        "\nSản phẩm: " +
        currentOrder.name +

        "\nGiá: " +
        formatMoney(currentOrder.price)

    );


    closeModal();

}


/* =====================================================
   QUAY VỀ SHOP
   ===================================================== */

function goBack(){

    if(document.referrer){

        history.back();

    }else{

        window.location.href =
            SHOP_BACK_URL;

    }

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value){

    return String(value)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* =====================================================
   ESCAPE JAVASCRIPT
   ===================================================== */

function escapeJS(value){

    return String(value)

        .replace(/\\/g,"\\\\")

        .replace(/'/g,"\\'")

        .replace(/\n/g,"\\n")

        .replace(/\r/g,"\\r");

}


/* =====================================================
   CLICK RA NGOÀI MODAL
   ===================================================== */

document
    .getElementById("orderModal")
    .addEventListener("click",function(event){

        if(event.target === this){

            closeModal();

        }

    });


/* =====================================================
   KHỞI ĐỘNG
   ===================================================== */

renderAccounts();

renderServices();

</script>

</body>
</html>
```
