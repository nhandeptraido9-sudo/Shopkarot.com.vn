        <div class="logo">

            ← Về Shop

<main class="container">

    <div class="hero">

        <p>

    <!-- ================= TABS ================= -->

        <button

            </h2>

                id="serviceSearch"
                class="search"
                type="text"
                placeholder="🔎 Tìm dịch vụ..."
                oninput="filterServices()"
            >

        </div>

    </section>

</main>


<footer>
    SHOPKAROT © 2026 - Steal an Egg
</footer>


<!-- ================= MODAL ================= -->

<div id="orderModal" class="modal">

        <button class="close" onclick="closeModal()">
            ×
        </button>

                Username Roblox
            </label>

                id="robloxUsername"
                type="text"

            >

<script>

/* =====================================================
   CẤU HÌNH
   ===================================================== */

const BACK_URL = "index.html";

let currentPrice = "ALL";

let currentOrder = null;


/* =====================================================
   ACC STEAL AN EGG

   MỖI MỨC CHỈ 1 ACC MẪU

   0K
   20K
   50K
   ===================================================== */

const accounts = [

    {
        id:"SAE-0K-001",
        name:"Acc Steal an Egg #001",
        package:"0K",
        price:0,
        status:"Còn hàng",
        description:"Acc Steal an Egg gói 0K."
    },

    {
        id:"SAE-20K-001",
        name:"Acc Steal an Egg #001",
        package:"20K",
        price:20000,
        status:"Còn hàng",
        description:"Acc Steal an Egg gói 20K."
    },

    {
        id:"SAE-50K-001",
        name:"Acc Steal an Egg #001",
        package:"50K",
        price:50000,
        status:"Còn hàng",
        description:"Acc Steal an Egg gói 50K."
    }

];


/* =====================================================
   DỊCH VỤ STEAL AN EGG
   ===================================================== */

const services = [

    {
        id:"DV-SAE-001",
        name:"Cày Steal an Egg",
        price:50000,
        status:"Đang nhận",
        description:
            "Dịch vụ cày Steal an Egg theo yêu cầu của khách."
    },

    {
        id:"DV-SAE-002",
        name:"Farm Egg",
        price:100000,
        status:"Đang nhận",
        description:
            "Farm Egg theo mục tiêu hoặc thời gian khách yêu cầu."
    },

    {
        id:"DV-SAE-003",
        name:"Farm VIP",
        price:200000,
        status:"Đang nhận",
        description:
            "Dịch vụ farm nâng cao dành cho khách hàng."
    }

];


/* =====================================================
   FORMAT TIỀN
   ===================================================== */

function formatMoney(value){

    return Number(value).toLocaleString("vi-VN") + "đ";

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   ESCAPE JAVASCRIPT
   ===================================================== */

function escapeJS(value){

    return String(value)
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/\r/g,"\\r")
        .replace(/\n/g,"\\n");

}


/* =====================================================
   RENDER ACC
   ===================================================== */

function renderAccounts(data){

    const grid =
        document.getElementById("accountGrid");


    if(!data.length){

        grid.innerHTML = `
            <div class="empty">
                Không có acc trong mục này.
            </div>
        `;

        return;
    }


    grid.innerHTML = data.map(acc => {

        const free =
            Number(acc.price) === 0;

        const sold =
            acc.status !== "Còn hàng";


        return `

            <div class="card">

                <span class="badge
                    ${free ? "free" : ""}
                    ${sold ? "sold" : ""}
                ">
                    ${escapeHTML(acc.status)}
                </span>


                <div class="card-title">
                    ${escapeHTML(acc.name)}
                </div>


                <div class="info">

                    Mã:
                    ${escapeHTML(acc.id)}

                    <br>

                    Gói:
                    <b>${escapeHTML(acc.package)}</b>

                </div>


                <div class="price
                    ${free ? "free" : ""}
                ">

                    ${formatMoney(acc.price)}

                </div>


                <div class="info">

                    ${escapeHTML(acc.description)}

                </div>


                <button
                    class="buy-btn"
                    ${sold ? "disabled" : ""}
                    onclick="openOrder(
                        'ACC',
                        '${escapeJS(acc.id)}',
                        '${escapeJS(acc.name)}',
                        '${escapeJS(acc.package)}',
                        ${Number(acc.price)}
                    )"
                >

                    ${sold
                        ? "❌ Hết hàng"
                        : "🛒 Mua acc"
                    }

                </button>

            </div>

        `;

    }).join("");

}


/* =====================================================
   RENDER DỊCH VỤ
   ===================================================== */

function renderServices(data){

    const grid =
        document.getElementById("serviceGrid");


    if(!data.length){

        grid.innerHTML = `
            <div class="empty">
                Không tìm thấy dịch vụ.
            </div>
        `;

        return;
    }


    grid.innerHTML = data.map(service => `

        <div class="card">

            <div class="service-icon">
                🛠️
            </div>

            <span class="badge">
                ${escapeHTML(service.status)}
            </span>

            <div class="card-title">
                ${escapeHTML(service.name)}
            </div>

            <div class="service-description">
                ${escapeHTML(service.description)}
            </div>

            <div class="price">
                ${formatMoney(service.price)}
            </div>

            <div class="info">
                Mã dịch vụ:
                ${escapeHTML(service.id)}
            </div>

            <button
                class="buy-btn"
                onclick="openOrder(
                    'SERVICE',
                    '${escapeJS(service.id)}',
                    '${escapeJS(service.name)}',
                    '',
                    ${Number(service.price)}
                )"
            >
                🛒 Đặt dịch vụ
            </button>

        </div>

    `).join("");

}


/* =====================================================
   CHUYỂN TAB
   ===================================================== */

function showTab(tabName,button){

    document
        .querySelectorAll(".section")
        .forEach(section => {

            section.classList.remove("active");

        });


    document
        .querySelectorAll(".main-tab")
        .forEach(tab => {

            tab.classList.remove("active");

        });


    document
        .getElementById(tabName)
        .classList.add("active");


    button.classList.add("active");

}


/* =====================================================
   LỌC GIÁ
   ===================================================== */

function selectPrice(price,button){

    currentPrice = price;


    document
        .querySelectorAll(".price-btn")
        .forEach(btn => {

            btn.classList.remove("active");

        });


    button.classList.add("active");


    filterAccounts();

}


/* =====================================================
   LỌC ACC
   ===================================================== */

function filterAccounts(){

    const keyword =
        document
            .getElementById("accountSearch")
            .value
            .toLowerCase()
            .trim();


    const result =
        accounts.filter(acc => {

            const keywordMatch =

                acc.id
                    .toLowerCase()
                    .includes(keyword)

                ||

                acc.name
                    .toLowerCase()
                    .includes(keyword)

                ||

                acc.package
                    .toLowerCase()
                    .includes(keyword);


            const priceMatch =

                currentPrice === "ALL"

                ||

                acc.package === currentPrice;


            return keywordMatch && priceMatch;

        });


    renderAccounts(result);

}


/* =====================================================
   LỌC DỊCH VỤ
   ===================================================== */

function filterServices(){

    const keyword =
        document
            .getElementById("serviceSearch")
            .value
            .toLowerCase()
            .trim();


    const result =
        services.filter(service =>

            service.id
                .toLowerCase()
                .includes(keyword)

            ||

            service.name
                .toLowerCase()
                .includes(keyword)

            ||

            service.description
                .toLowerCase()
                .includes(keyword)

        );


    renderServices(result);

}


/* =====================================================
   MỞ FORM ĐẶT HÀNG
   ===================================================== */

function openOrder(
    type,
    id,
    name,
    packageName,
    price
){

    currentOrder = {

        type:type,

        id:id,

        name:name,

        package:packageName,

        price:Number(price)

    };


    document
        .getElementById("modalTitle")
        .textContent =
            type === "ACC"
                ? "🛒 Mua Acc Steal an Egg"
                : "🛠️ Đặt dịch vụ Steal an Egg";


    document
        .getElementById("selectedProduct")
        .innerHTML = `

            <b>${escapeHTML(name)}</b>

            ${
                packageName
                    ? `<br>Gói:
                       <b>${escapeHTML(packageName)}</b>`
                    : ""
            }

            <br>

            Giá:
            <b>${formatMoney(price)}</b>

        `;


    document
        .getElementById("customerName")
        .value = "";


    document
        .getElementById("robloxUsername")
        .value = "";


    document
        .getElementById("customerNote")
        .value = "";


    document
        .getElementById("orderModal")
        .classList.add("show");

}


/* =====================================================
   ĐÓNG FORM
   ===================================================== */

function closeModal(){

    document
        .getElementById("orderModal")
        .classList.remove("show");

    currentOrder = null;

}


/* =====================================================
   GỬI ĐƠN
   ===================================================== */

function submitOrder(){

    if(!currentOrder){

        alert("Chưa chọn sản phẩm.");

        return;

    }


    const customerName =
        document
            .getElementById("customerName")
            .value
            .trim();


    const robloxUsername =
        document
            .getElementById("robloxUsername")
            .value
            .trim();


    const note =
        document
            .getElementById("customerNote")
            .value
            .trim();


    if(!customerName){

        alert("Vui lòng nhập tên khách.");

        return;

    }


    if(!robloxUsername){

        alert("Vui lòng nhập Username Roblox.");

        return;

    }


    const orderCode =
        "SAE-" +
        Date.now().toString().slice(-8);


    const order = {

        maDon:orderCode,

        loaiDon:currentOrder.type,

        maSanPham:currentOrder.id,

        sanPham:currentOrder.name,

        goi:currentOrder.package,

        gia:currentOrder.price,

        tenKhach:customerName,

        usernameRoblox:robloxUsername,

        ghiChu:note,

        trangThai:"Chờ xử lý",

        ngayTao:
            new Date().toLocaleString("vi-VN")

    };


    const storageKey =
        "shopkarot_steal_an_egg_orders";


    const orders =
        JSON.parse(
            localStorage.getItem(storageKey)
            || "[]"
        );


    orders.push(order);


    localStorage.setItem(
        storageKey,
        JSON.stringify(orders)
    );


    alert(

        "✅ Đặt hàng thành công!\n\n" +

        "Mã đơn: " +
        orderCode +

        "\nSản phẩm: " +
        currentOrder.name +

        "\nGiá: " +
        formatMoney(currentOrder.price)

    );


    closeModal();

}


/* =====================================================
   QUAY VỀ SHOP
   ===================================================== */

function goBack(){

    if(document.referrer){

        history.back();

        return;

    }


    window.location.href =
        BACK_URL;

}


/* =====================================================
   CLICK NGOÀI MODAL
   ===================================================== */

document
    .getElementById("orderModal")
    .addEventListener(
        "click",
        function(event){

            if(event.target === this){

                closeModal();

            }

        }
    );


/* =====================================================
   PHÍM ESC
   ===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){

            closeModal();

        }

    }
);


/* =====================================================
   KHỞI ĐỘNG
   ===================================================== */

renderAccounts(accounts);

renderServices(services);

</script>

</body>
</html>
