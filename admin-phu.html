<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Admin phụ - SHOPKAROT</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6fa;
}

.box{
    width:420px;
    max-width:92%;
    background:#fff;
    padding:30px;
    border-radius:18px;
    box-shadow:0 10px 35px rgba(0,0,0,.15);
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:900;
    font-style:italic;
    margin-bottom:5px;
}

.logo span{
    color:#e21b23;
}

h2{
    text-align:center;
    margin:10px 0 8px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:22px;
}

.badge{
    text-align:center;
    background:#f1f1f1;
    color:#333;
    padding:11px;
    border-radius:10px;
    margin-bottom:18px;
    font-weight:bold;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#555;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#222;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#444;
}

.message{
    text-align:center;
    margin-top:15px;
    min-height:20px;
    font-weight:bold;
}

.back{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#666;
    text-decoration:none;
}

</style>
</head>

<body>

<div class="box">

    <div class="logo">
        SHOP<span>KAROT</span>
    </div>

    <h2>👤 ADMIN PHỤ</h2>

    <div class="subtitle">
        Khu vực quản trị phụ
    </div>

    <div class="badge">
        🔐 ĐĂNG NHẬP ADMIN PHỤ
    </div>

    <input
        id="username"
        type="text"
        placeholder="Tên Admin phụ"
        autocomplete="off">

    <input
        id="password"
        type="password"
        placeholder="Mật khẩu Admin phụ"
        autocomplete="off">

    <button onclick="loginAdminPhu()">
        👤 ĐĂNG NHẬP ADMIN PHỤ
    </button>

    <div
        id="message"
        class="message">
    </div>

    <a
        class="back"
        href="login.html">
        ← Quay lại đăng nhập
    </a>

</div>

<script>

/*
================================================
TÀI KHOẢN ADMIN PHỤ
================================================

ĐỔI 2 DÒNG dưới đây.

Ví dụ:

const ADMIN_PHU_USER="adminphu";
const ADMIN_PHU_PASS="123456";

================================================
*/

const ADMIN_PHU_USER="adminphu";

const ADMIN_PHU_PASS=
    "THAY_MAT_KHAU_ADMIN_PHU";


function loginAdminPhu(){

    const username=
        document.getElementById("username")
        .value.trim();

    const password=
        document.getElementById("password")
        .value;

    const message=
        document.getElementById("message");


    if(!username || !password){

        message.style.color="red";

        message.textContent=
            "Vui lòng nhập đầy đủ thông tin.";

        return;
    }


    if(
        username!==ADMIN_PHU_USER ||
        password!==ADMIN_PHU_PASS
    ){

        message.style.color="red";

        message.textContent=
            "Tài khoản hoặc mật khẩu Admin phụ không đúng.";

        return;
    }


    localStorage.setItem(
        "shopkarot_admin_login",
        "true"
    );

    localStorage.setItem(
        "shopkarot_admin_type",
        "sub"
    );


    message.style.color="#168b42";

    message.textContent=
        "Đăng nhập Admin phụ thành công!";


    setTimeout(function(){

        window.location.href="index.html";

    },700);

}


/* Enter để đăng nhập */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key==="Enter"){
            loginAdminPhu();
        }

    }
);

</script>

</body>
</html>
