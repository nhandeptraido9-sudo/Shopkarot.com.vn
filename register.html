<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Đăng ký - SHOPKAROT</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6fa;
}
.box{
    width:400px;
    max-width:92%;
    background:#fff;
    padding:30px;
    border-radius:18px;
    box-shadow:0 10px 35px rgba(0,0,0,.15);
}
.logo{
    text-align:center;
    font-size:32px;
    font-weight:900;
    font-style:italic;
}
.logo span{color:#e21b23}
h2{
    text-align:center;
    margin:10px 0 25px;
}
input{
    width:100%;
    padding:14px;
    margin-bottom:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
}
button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#d01018;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}
button:hover{background:#b30d14}
.message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}
.links{
    text-align:center;
    margin-top:20px;
}
.links a{
    color:#d01018;
    text-decoration:none;
    font-weight:bold;
}
.home{
    display:block;
    text-align:center;
    margin-top:15px;
    color:#666;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="box">

    <div class="logo">
        SHOP<span>KAROT</span>
    </div>

    <h2>📝 ĐĂNG KÝ</h2>

    <input
        id="username"
        type="text"
        placeholder="Tên đăng nhập">

    <input
        id="password"
        type="password"
        placeholder="Mật khẩu">

    <input
        id="password2"
        type="password"
        placeholder="Nhập lại mật khẩu">

    <button onclick="register()">
        ĐĂNG KÝ
    </button>

    <div id="message" class="message"></div>

    <div class="links">
        Đã có tài khoản?
        <a href="login.html">ĐĂNG NHẬP</a>
    </div>

    <a class="home" href="index.html">
        ← Về trang chủ
    </a>

</div>

<script>

function register(){

    const username =
        document.getElementById("username")
        .value.trim();

    const password =
        document.getElementById("password")
        .value;

    const password2 =
        document.getElementById("password2")
        .value;

    const message =
        document.getElementById("message");

    if(username.length < 3){

        message.style.color="red";
        message.textContent=
            "Tên đăng nhập phải có ít nhất 3 ký tự.";

        return;
    }

    if(password.length < 6){

        message.style.color="red";
        message.textContent=
            "Mật khẩu phải có ít nhất 6 ký tự.";

        return;
    }

    if(password !== password2){

        message.style.color="red";
        message.textContent=
            "Mật khẩu nhập lại không giống nhau.";

        return;
    }

    let users =
        JSON.parse(
            localStorage.getItem("shopkarot_users") || "[]"
        );

    const exists =
        users.some(function(item){

            return item.username.toLowerCase()
                === username.toLowerCase();

        });

    if(exists){

        message.style.color="red";
        message.textContent=
            "Tên đăng nhập đã tồn tại.";

        return;
    }

    const newUser = {

        username:username,

        password:password,

        balance:0,

        createdAt:new Date().toISOString()

    };

    users.push(newUser);

    localStorage.setItem(
        "shopkarot_users",
        JSON.stringify(users)
    );

    localStorage.setItem(
        "shopkarot_user",
        username
    );

    localStorage.setItem(
        "shopkarot_login",
        "true"
    );

    localStorage.setItem(
        "shopkarot_balance",
        "0"
    );

    message.style.color="#168b42";
    message.textContent=
        "Đăng ký thành công!";

    setTimeout(function(){

        window.location.href="index.html";

    },700);
}

</script>

</body>
</html>
