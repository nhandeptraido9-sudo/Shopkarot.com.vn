<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hồ sơ - SHOPKAROT</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6fa;
    color:#222;
}

/* HEADER */

.header{
    background:#fff;
    padding:15px 25px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    position:sticky;
    top:0;
    z-index:10;
}

.logo{
    font-size:27px;
    font-weight:900;
    font-style:italic;
}

.logo span{
    color:#e21b23;
}

.header-buttons{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.header-buttons a,
.header-buttons button{
    border:0;
    text-decoration:none;
    padding:9px 14px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
    font-size:14px;
}

.home-btn{
    background:#eee;
    color:#333;
}

.logout-btn{
    background:#d01018;
    color:#fff;
}

/* CONTAINER */

.container{
    width:1000px;
    max-width:94%;
    margin:35px auto;
}

/* TITLE */

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h1{
    margin:0 0 8px;
    font-size:30px;
}

.title p{
    margin:0;
    color:#777;
}

/* LOADING */

.loading{
    background:#fff;
    border-radius:16px;
    padding:40px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    font-size:16px;
}

/* ERROR */

.error{
    display:none;
    background:#fff;
    border-radius:16px;
    padding:35px 25px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.error-icon{
    font-size:45px;
    margin-bottom:10px;
}

.error h2{
    color:#d01018;
    margin:10px 0;
}

.error p{
    color:#666;
}

.error button{
    border:0;
    background:#d01018;
    color:#fff;
    padding:12px 20px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

/* PROFILE */

.profile{
    display:none;
}

/* CARDS */

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.card{
    background:#fff;
    border-radius:16px;
    padding:22px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.card h2{
    margin:0 0 18px;
    font-size:20px;
}

.info-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    padding:13px 0;
    border-bottom:1px solid #eee;
}

.info-row:last-child{
    border-bottom:0;
}

.info-label{
    color:#777;
}

.info-value{
    font-weight:bold;
    text-align:right;
    word-break:break-word;
}

.balance{
    color:#d01018;
    font-size:23px;
}

.status{
    display:inline-block;
    padding:6px 11px;
    border-radius:20px;
    background:#e8f8ee;
    color:#168b42;
    font-size:13px;
}

/* ORDERS */

.orders-card{
    margin-top:18px;
}

.order-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.order{
    border:1px solid #eee;
    border-radius:12px;
    padding:15px;
    background:#fafafa;
}

.order-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.order-product{
    font-weight:bold;
    font-size:16px;
}

.order-id{
    color:#888;
    font-size:12px;
    margin-top:5px;
}

.order-info{
    margin-top:12px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    font-size:14px;
}

.order-info div{
    background:#fff;
    padding:8px;
    border-radius:7px;
}

.order-status{
    padding:5px 9px;
    border-radius:15px;
    font-size:12px;
    font-weight:bold;
    white-space:nowrap;
}

.status-completed{
    background:#e8f8ee;
    color:#168b42;
}

.status-pending{
    background:#fff4d8;
    color:#a36b00;
}

.status-other{
    background:#eee;
    color:#555;
}

/* ACCOUNT BUTTONS */

.actions{
    margin-top:18px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.action-btn{
    border:0;
    padding:12px 18px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
    text-decoration:none;
    display:inline-block;
}

.shop-btn{
    background:#d01018;
    color:#fff;
}

.refresh-btn{
    background:#eee;
    color:#333;
}

/* EMPTY */

.empty{
    text-align:center;
    color:#888;
    padding:25px 10px;
}

/* MOBILE */

@media(max-width:700px){

    .header{
        padding:13px 15px;
        align-items:flex-start;
    }

    .logo{
        font-size:22px;
    }

    .header-buttons a,
    .header-buttons button{
        padding:8px 10px;
        font-size:12px;
    }

    .container{
        margin:25px auto;
    }

    .title h1{
        font-size:25px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .order-info{
        grid-template-columns:1fr;
    }

}
</style>
</head>

<body>

<!-- HEADER -->

<header class="header">

    <div class="logo">
        SHOP<span>KAROT</span>
    </div>

    <div class="header-buttons">

        <a
            href="index.html"
            class="home-btn">
            🏠 Trang chủ
        </a>

        <button
            class="logout-btn"
            onclick="logout()">
            🚪 Đăng xuất
        </button>

    </div>

</header>


<!-- MAIN -->

<main class="container">

    <div class="title">

        <h1>👤 HỒ SƠ CỦA TÔI</h1>

        <p>
            Quản lý thông tin tài khoản và xem lịch sử mua hàng
        </p>

    </div>


    <!-- LOADING -->

    <div
        id="loading"
        class="loading">

        ⏳ Đang tải hồ sơ...

    </div>


    <!-- ERROR -->

    <div
        id="error"
        class="error">

        <div class="error-icon">
            ⚠️
        </div>

        <h2 id="errorTitle">
            Không thể tải hồ sơ
        </h2>

        <p id="errorMessage">
            Đã xảy ra lỗi.
        </p>

        <button
            onclick="goLogin()">
            🔐 Đăng nhập lại
        </button>

    </div>


    <!-- PROFILE -->

    <div
        id="profile"
        class="profile">


        <!-- THÔNG TIN -->

        <div class="grid">


            <!-- ACCOUNT -->

            <div class="card">

                <h2>
                    👤 Thông tin tài khoản
                </h2>

                <div class="info-row">

                    <span class="info-label">
                        Tên đăng nhập
                    </span>

                    <span
                        id="username"
                        class="info-value">
                        ---
                    </span>

                </div>


                <div class="info-row">

                    <span class="info-label">
                        Mật khẩu
                    </span>

                    <span
                        id="password"
                        class="info-value">
                        ---
                    </span>

                </div>


                <div class="info-row">

                    <span class="info-label">
                        Ngày tạo
                    </span>

                    <span
                        id="createdAt"
                        class="info-value">
                        ---
                    </span>

                </div>


                <div class="info-row">

                    <span class="info-label">
                        Trạng thái
                    </span>

                    <span
                        id="status"
                        class="info-value">
                        ---
                    </span>

                </div>

            </div>


            <!-- BALANCE -->

            <div class="card">

                <h2>
                    💰 Tài khoản
                </h2>

                <div class="info-row">

                    <span class="info-label">
                        Số dư hiện tại
                    </span>

                    <span
                        id="balance"
                        class="info-value balance">
                        0đ
                    </span>

                </div>


                <div class="actions">

                    <a
                        href="nap-tien.html"
                        class="action-btn shop-btn">
                        💳 Nạp tiền
                    </a>

                    <button
                        onclick="loadProfile()"
                        class="action-btn refresh-btn">
                        🔄 Làm mới
                    </button>

                </div>

            </div>

        </div>


        <!-- ĐƠN HÀNG -->

        <div class="card orders-card">

            <h2>
                🧾 Lịch sử đơn hàng
            </h2>

            <div
                id="orders"
                class="order-list">

            </div>

        </div>

    </div>

</main>


<script>

/* =========================================================
   SHOPKAROT API
========================================================= */

const API_URL =
    "https://script.google.com/macros/s/AKfycbx5vvv2zvwdeX2a0aQiP9Lslrqir6zGS1Tu8mPgL132e94tu5ASqXLxqXQsNhBzHAc/exec";


/* =========================================================
   KIỂM TRA TÀI KHOẢN ĐÃ ĐĂNG NHẬP
========================================================= */

function getLoggedUsername(){

    /*
     * login.html của bạn lưu:
     *
     * shopkarot_user
     * shopkarot_username
     *
     * Ưu tiên shopkarot_username.
     */

    let username =
        localStorage.getItem(
            "shopkarot_username"
        );

    if(!username){

        username =
            localStorage.getItem(
                "shopkarot_user"
            );

    }

    return (
        username || ""
    ).trim();

}


/* =========================================================
   KIỂM TRA LOGIN FLAG
========================================================= */

function isLoggedIn(){

    const username =
        getLoggedUsername();

    const login1 =
        localStorage.getItem(
            "shopkarot_login"
        );

    const login2 =
        localStorage.getItem(
            "shopkarot_logged_in"
        );

    /*
     * Chỉ cần có username là đủ.
     *
     * Điều này giúp tránh lỗi:
     *
     * "Bạn chưa đăng nhập"
     *
     * khi username vẫn còn nhưng một
     * flag login bị mất.
     */

    return !!username;

}


/* =========================================================
   FORMAT MONEY
========================================================= */

function formatMoney(value){

    const number =
        Number(value || 0);

    return number.toLocaleString(
        "vi-VN"
    ) + "đ";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   LOAD PROFILE
========================================================= */

async function loadProfile(){

    const loading =
        document.getElementById(
            "loading"
        );

    const error =
        document.getElementById(
            "error"
        );

    const profile =
        document.getElementById(
            "profile"
        );


    loading.style.display =
        "block";

    error.style.display =
        "none";

    profile.style.display =
        "none";


    /*
     * LẤY USERNAME TỪ LOGIN
     */

    const username =
        getLoggedUsername();


    if(!username){

        showError(
            "⚠️ Bạn chưa đăng nhập",
            "Vui lòng đăng nhập rồi mở lại trang Hồ sơ."
        );

        return;

    }


    try{

        /*
         * API:
         *
         * action=getProfile
         * username=...
         */

        const url =
            API_URL +
            "?action=getProfile&username=" +
            encodeURIComponent(
                username
            );


        const response =
            await fetch(url,{
                method:"GET",
                cache:"no-store"
            });


        if(!response.ok){

            throw new Error(
                "Không thể kết nối API."
            );

        }


        const data =
            await response.json();


        console.log(
            "PROFILE API:",
            data
        );


        if(!data.ok){

            throw new Error(
                data.message ||
                "Không tìm thấy tài khoản"
            );

        }


        /*
         * HIỂN THỊ PROFILE
         */

        renderProfile(
            data
        );


        loading.style.display =
            "none";

        profile.style.display =
            "block";


    }catch(error){

        console.error(
            "PROFILE ERROR:",
            error
        );

        showError(
            "⚠️ Không thể tải hồ sơ",
            error.message ||
            "Không thể tải dữ liệu tài khoản."
        );

    }

}


/* =========================================================
   RENDER PROFILE
========================================================= */

function renderProfile(data){

    const p =
        data.profile || {};


    document.getElementById(
        "username"
    ).textContent =
        p.username || "---";


    /*
     * Hiển thị mật khẩu theo đúng
     * dữ liệu Code.gs trả về.
     */

    document.getElementById(
        "password"
    ).textContent =
        p.password || "---";


    document.getElementById(
        "createdAt"
    ).textContent =
        p.createdAt || "---";


    document.getElementById(
        "balance"
    ).textContent =
        formatMoney(
            p.balance
        );


    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        p.status ||
        "active";


    status.className =
        "info-value status";


    /*
     * Cập nhật số dư localStorage
     */

    localStorage.setItem(
        "shopkarot_balance",
        String(
            Number(
                p.balance || 0
            )
        )
    );


    /*
     * Đồng bộ username nếu cần
     */

    if(p.username){

        localStorage.setItem(
            "shopkarot_user",
            p.username
        );

        localStorage.setItem(
            "shopkarot_username",
            p.username
        );

    }


    renderOrders(
        data.orders || []
    );

}


/* =========================================================
   RENDER ORDERS
========================================================= */

function renderOrders(orders){

    const container =
        document.getElementById(
            "orders"
        );


    if(!orders.length){

        container.innerHTML = `
            <div class="empty">
                📦 Bạn chưa có đơn hàng nào.
            </div>
        `;

        return;

    }


    container.innerHTML =
        orders.map(function(order){

            const status =
                String(
                    order.status || ""
                ).toLowerCase();


            let statusClass =
                "status-other";


            if(
                status ===
                "completed"
            ){

                statusClass =
                    "status-completed";

            }else if(
                status ===
                "pending"
            ){

                statusClass =
                    "status-pending";

            }


            let statusText =
                order.status ||
                "Không xác định";


            if(
                status ===
                "completed"
            ){

                statusText =
                    "Đã hoàn thành";

            }else if(
                status ===
                "pending"
            ){

                statusText =
                    "Đang xử lý";

            }


            return `

                <div class="order">

                    <div class="order-top">

                        <div>

                            <div class="order-product">
                                ${escapeHTML(
                                    order.product ||
                                    "Sản phẩm"
                                )}
                            </div>

                            <div class="order-id">
                                Mã đơn:
                                ${escapeHTML(
                                    order.id ||
                                    "---"
                                )}
                            </div>

                        </div>


                        <span
                            class="order-status ${statusClass}">
                            ${escapeHTML(
                                statusText
                            )}
                        </span>

                    </div>


                    <div class="order-info">

                        <div>
                            💰 Giá:
                            <b>
                                ${formatMoney(
                                    order.price
                                )}
                            </b>
                        </div>


                        <div>
                            🕒 Ngày mua:
                            <b>
                                ${escapeHTML(
                                    order.createdAt ||
                                    "---"
                                )}
                            </b>
                        </div>


                        <div>
                            🎮 Game:
                            <b>
                                ${escapeHTML(
                                    order.game ||
                                    "---"
                                )}
                            </b>
                        </div>


                        <div>
                            📁 Thư mục:
                            <b>
                                ${escapeHTML(
                                    order.folder ||
                                    "---"
                                )}
                            </b>
                        </div>

                    </div>


                    ${
                        order.accUsername
                        ?
                        `
                        <div
                            style="
                                margin-top:12px;
                                padding:12px;
                                background:#fff;
                                border-radius:9px;
                            ">

                            🔑 Tài khoản:
                            <b>
                                ${escapeHTML(
                                    order.accUsername
                                )}
                            </b>

                            <br>

                            🔒 Mật khẩu:
                            <b>
                                ${escapeHTML(
                                    order.accPassword ||
                                    "---"
                                )}
                            </b>

                        </div>
                        `
                        :
                        ""
                    }

                </div>

            `;

        }).join("");

}


/* =========================================================
   SHOW ERROR
========================================================= */

function showError(
    title,
    message
){

    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "profile"
    ).style.display =
        "none";


    document.getElementById(
        "error"
    ).style.display =
        "block";


    document.getElementById(
        "errorTitle"
    ).textContent =
        title;


    document.getElementById(
        "errorMessage"
    ).textContent =
        message;

}


/* =========================================================
   GO LOGIN
========================================================= */

function goLogin(){

    window.location.href =
        "login.html";

}


/* =========================================================
   LOGOUT
========================================================= */

function logout(){

    /*
     * Xóa toàn bộ thông tin đăng nhập
     * của SHOPKAROT.
     */

    localStorage.removeItem(
        "shopkarot_user"
    );

    localStorage.removeItem(
        "shopkarot_username"
    );

    localStorage.removeItem(
        "shopkarot_login"
    );

    localStorage.removeItem(
        "shopkarot_logged_in"
    );

    localStorage.removeItem(
        "shopkarot_balance"
    );


    window.location.href =
        "login.html";

}


/* =========================================================
   TỰ ĐỘNG TẢI HỒ SƠ
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadProfile();

    }
);

</script>

</body>
</html>
