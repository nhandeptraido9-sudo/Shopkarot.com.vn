<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Đăng nhập - SHOPKAROT</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6fa;
}

.box{
    width:400px;
    max-width:92%;
    background:#fff;
    padding:30px;
    border-radius:18px;
    box-shadow:0 10px 35px rgba(0,0,0,.15);
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:900;
    font-style:italic;
    margin-bottom:10px;
}

.logo span{
    color:#e21b23;
}

h2{
    text-align:center;
    margin:10px 0 25px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#d01018;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#b30d14;
}

/* ADMIN PHỤ */

.admin-phu-btn{
    display:block;
    width:100%;
    margin-top:10px;
    padding:14px;
    border-radius:10px;
    background:#222;
    color:#fff;
    text-align:center;
    font-size:15px;
    font-weight:bold;
    text-decoration:none;
    transition:.2s;
}

.admin-phu-btn:hover{
    background:#444;
    transform:translateY(-1px);
}

.message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

.links{
    text-align:center;
    margin-top:20px;
}

.links a{
    color:#d01018;
    text-decoration:none;
    font-weight:bold;
}

.home{
    display:block;
    text-align:center;
    margin-top:15px;
    color:#666;
    text-decoration:none;
}

</style>
</head>

<body>

<div class="box">

    <div class="logo">
        SHOP<span>KAROT</span>
    </div>

    <h2>🔐 ĐĂNG NHẬP</h2>

    <input
        id="username"
        type="text"
        placeholder="Tên đăng nhập">

    <input
        id="password"
        type="password"
        placeholder="Mật khẩu">

    <button onclick="login()">
        ĐĂNG NHẬP
    </button>

    <!-- ADMIN PHỤ -->

    <a
        href="admin-phu.html"
        class="admin-phu-btn">
        👤 ĐĂNG NHẬP ADMIN PHỤ
    </a>

    <div id="message" class="message"></div>

    <div class="links">
        Chưa có tài khoản?
        <a href="register.html">ĐĂNG KÝ</a>
    </div>

    <a class="home" href="index.html">
        ← Về trang chủ
    </a>

</div>

<script>

function login(){

    const username =
        document.getElementById("username")
        .value.trim();

    const password =
        document.getElementById("password")
        .value;

    const message =
        document.getElementById("message");

    if(!username || !password){

        message.style.color="red";
        message.textContent=
            "Vui lòng nhập đầy đủ thông tin.";

        return;
    }

    const users =
        JSON.parse(
            localStorage.getItem("shopkarot_users") || "[]"
        );

    const user =
        users.find(function(item){

            return item.username.toLowerCase()
                === username.toLowerCase()
                && item.password === password;

        });

    if(!user){

        message.style.color="red";
        message.textContent=
            "Tên đăng nhập hoặc mật khẩu không đúng.";

        return;
    }

    localStorage.setItem(
        "shopkarot_user",
        user.username
    );

    localStorage.setItem(
        "shopkarot_login",
        "true"
    );

    localStorage.setItem(
        "shopkarot_balance",
        String(user.balance || 0)
    );

    message.style.color="#168b42";
    message.textContent=
        "Đăng nhập thành công!";

    setTimeout(function(){

        window.location.href="index.html";

    },700);
}

</script>

</body>
</html>
