<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Đăng nhập - SHOPKAROT</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6fa;
}

.box{
    width:400px;
    max-width:92%;
    background:#fff;
    padding:30px;
    border-radius:18px;
    box-shadow:0 10px 35px rgba(0,0,0,.15);
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:900;
    font-style:italic;
    margin-bottom:10px;
}

.logo span{
    color:#e21b23;
}

h2{
    text-align:center;
    margin:10px 0 25px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#d01018;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#b30d14;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* ADMIN CHÍNH */

.admin-main-btn{
    display:block;
    width:100%;
    margin-top:10px;
    padding:14px;
    border-radius:10px;
    background:#333;
    color:#fff;
    text-align:center;
    font-size:15px;
    font-weight:bold;
    text-decoration:none;
    transition:.2s;
}

.admin-main-btn:hover{
    background:#444;
    transform:translateY(-1px);
}

/* ADMIN PHỤ */

.admin-phu-btn{
    display:block;
    width:100%;
    margin-top:10px;
    padding:14px;
    border-radius:10px;
    background:#222;
    color:#fff;
    text-align:center;
    font-size:15px;
    font-weight:bold;
    text-decoration:none;
    transition:.2s;
}

.admin-phu-btn:hover{
    background:#444;
    transform:translateY(-1px);
}

.message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
    min-height:20px;
}

.links{
    text-align:center;
    margin-top:20px;
}

.links a{
    color:#d01018;
    text-decoration:none;
    font-weight:bold;
}

.home{
    display:block;
    text-align:center;
    margin-top:15px;
    color:#666;
    text-decoration:none;
}

.loading{
    display:none;
    text-align:center;
    margin-top:10px;
    color:#777;
    font-size:14px;
}
</style>
</head>

<body>

<div class="box">

    <div class="logo">
        SHOP<span>KAROT</span>
    </div>

    <h2>🔐 ĐĂNG NHẬP</h2>

    <input
        id="username"
        type="text"
        placeholder="Tên đăng nhập"
        autocomplete="username">

    <input
        id="password"
        type="password"
        placeholder="Mật khẩu"
        autocomplete="current-password">

    <button
        id="loginButton"
        onclick="login()">
        ĐĂNG NHẬP
    </button>

    <div id="loading" class="loading">
        ⏳ Đang kiểm tra tài khoản...
    </div>

    <a href="admin.html" class="admin-main-btn">
        🛠️ ĐĂNG NHẬP ADMIN CHÍNH
    </a>

    <a href="admin-phu.html" class="admin-phu-btn">
        👤 ĐĂNG NHẬP ADMIN PHỤ
    </a>

    <div id="message" class="message"></div>

    <div class="links">
        Chưa có tài khoản?
        <a href="register.html">ĐĂNG KÝ</a>
    </div>

    <a class="home" href="index.html">
        ← Về trang chủ
    </a>

</div>


<script>

/* =========================================================
   SHOPKAROT API
========================================================= */

/*
 * THAY LINK BÊN DƯỚI BẰNG LINK WEB APP APPS SCRIPT
 *
 * Ví dụ:
 * https://script.google.com/macros/s/XXXXXXXX/exec
 */

const API_URL =
    "https://script.google.com/macros/s/AKfycbzvLguady_9Krw5eJ-qapaKk0hwc8wEvfuKU-eRH7Qdy_0f0ggC57q4GIX8pCzGh-zmMw/exec";


/* =========================================================
   LOGIN
========================================================= */

async function login(){

    const username =
        document
        .getElementById("username")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;

    const message =
        document
        .getElementById("message");

    const button =
        document
        .getElementById("loginButton");

    const loading =
        document
        .getElementById("loading");


    /* KIỂM TRA */

    if(!username || !password){

        message.style.color="red";

        message.textContent =
            "Vui lòng nhập đầy đủ thông tin.";

        return;

    }


    /* LOADING */

    button.disabled=true;

    loading.style.display="block";

    message.textContent="";


    try{

        /*
         * Gửi đăng nhập lên Apps Script
         */

        const response =
            await fetch(API_URL,{

                method:"POST",

                headers:{
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body:JSON.stringify({

                    action:"login",

                    username:username,

                    password:password

                })

            });


        const result =
            await response.json();


        /*
         * ĐĂNG NHẬP THẤT BẠI
         */

        if(!result.ok){

            message.style.color="red";

            message.textContent =
                result.message ||
                "Đăng nhập thất bại.";

            return;

        }


        /*
         * ĐĂNG NHẬP THÀNH CÔNG
         */

        localStorage.setItem(
            "shopkarot_user",
            result.username
        );

        localStorage.setItem(
            "shopkarot_username",
            result.username
        );

        localStorage.setItem(
            "shopkarot_login",
            "true"
        );

        localStorage.setItem(
            "shopkarot_logged_in",
            "true"
        );

        localStorage.setItem(
            "shopkarot_balance",
            String(
                Number(
                    result.balance || 0
                )
            )
        );


        message.style.color="#168b42";

        message.textContent =
            "Đăng nhập thành công!";


        /*
         * Chuyển về trang chủ
         */

        setTimeout(function(){

            window.location.href =
                "index.html";

        },700);


    }catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );

        message.style.color="red";

        message.textContent =
            "Không kết nối được Apps Script.";


    }finally{

        button.disabled=false;

        loading.style.display="none";

    }

}


/* =========================================================
   ENTER ĐỂ ĐĂNG NHẬP
========================================================= */

document
.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            login();

        }

    }
);

</script>

</body>
</html>
