<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập SHOPKAROT</title><link rel="stylesheet" href="assets/style.css"><style>.login{max-width:420px;margin:100px auto;background:#fff;padding:35px;border-radius:20px;box-shadow:0 8px 30px #0002}.login input,.login button{width:100%;padding:14px;margin:7px 0;border-radius:10px}.login input{border:1px solid #ddd}.login button{border:0;background:#e21b23;color:#fff;font-weight:bold}</style></head><body><div class="login"><h1>🔐 SHOPKAROT</h1><input id="u" placeholder="Tên đăng nhập"><input id="p" type="password" placeholder="Mật khẩu"><button onclick="go()">ĐĂNG NHẬP</button></div><script>function go(){if(u.value.length<3||p.value.length<3)return alert("Nhập tối thiểu 3 ký tự");localStorage.setItem("shopkarot_user",u.value);location.href="index.html"}</script></body></html>
