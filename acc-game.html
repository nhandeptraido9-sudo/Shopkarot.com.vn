<main class="container"><div class="section-head"><h1>🎮 Acc Game</h1></div><div class="products">
<script>
const products=[
['ACC ROBLOX #001','20.000đ','Tài khoản Roblox ngẫu nhiên'],
['ACC ROBLOX #002','30.000đ','Tài khoản Roblox ngẫu nhiên'],
['ACC ROBLOX #003','50.000đ','Tài khoản Roblox ngẫu nhiên'],
['ACC PREMIUM #001','100.000đ','Acc premium'],
['ACC PREMIUM #002','150.000đ','Acc premium'],
['ACC PREMIUM #003','200.000đ','Acc premium']
];
document.write(products.map((p,i)=>`<article class="product"><div class="emoji">🎮</div><h3>${p[0]}</h3><p>${p[2]}</p><strong>${p[1]}</strong><button class="btn small" onclick="buy('${p[0]}','${p[1]}')">Mua ngay</button></article>`).join(''));
function buy(name,price){
 if(!localStorage.getItem('shopkarot_user')){location.href='login.html';return;}
 const id='SK'+Date.now(); let orders=JSON.parse(localStorage.getItem('shopkarot_orders')||'[]');
 orders.unshift({id,name,price,date:new Date().toLocaleString('vi-VN'),account:'acc_demo_'+Math.floor(Math.random()*9000+1000),password:'pass_'+Math.floor(Math.random()*900000+100000)});
 localStorage.setItem('shopkarot_orders',JSON.stringify(orders)); location.href='lich-su.html';
}
</script>
